<style>

/* Modern Standard (Firefox and upcoming browsers) */
html {
  /* Format: scrollbar-color: [Grabber Color] [Track Color] */
  scrollbar-color: #888888 transparent;
  scrollbar-width: thin;
}

/* WebKit Browsers (Chrome, Edge, Safari) */
::-webkit-scrollbar {
  width: 8px;  /* Width of vertical scrollbar */
  height: 8px; /* Height of horizontal scrollbar */
}

/* The Track (The white background area) */
::-webkit-scrollbar-track {
  background: transparent; /* Makes the track invisible */
}

/* The Grabber (The draggable handle) */
::-webkit-scrollbar-thumb {
  background: #888888;    /* Color of the grabber */
  border-radius: 4px;     /* Rounds the corners of the grabber */
}

/* Optional: Change grabber color on hover */
::-webkit-scrollbar-thumb:hover {
  background: #555555;
}


.parent {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 20px;
    height: 100%;

}

.div1 {
    grid-column: span 2 / span 2;
}

.div2 {

}

.div3 {
    grid-column: span 2 / span 2;
    grid-row: span 7 / span 7;

}

.div4 {

}

<script>

let shopDropdownopen = true
let target = '#football'
let pretarget = ''
let activeAnimation = null;
let cooldown = 0

function animate(timestamp) {

  if (cooldown > 0) {
    cooldown = cooldown - 0.01
  }

  const footballel = document.querySelector(target);



  if (target !== pretarget) {
    try {
      document.querySelector(pretarget).style.color = "#000"
      const bigtext = document.querySelector('#bigtext')

      if (cooldown > 0) {
        bigtext.textContent = footballel.textContent
      } else {
        cooldown = 1
        const activeAnimation = bigtext.animate([
          { opacity: 1, transform: 'translateY(0px)' },
          { opacity: 0, transform: 'translateY(-10px)' }
        ], {
          duration: 300,
          easing: 'ease-in'
        });

        activeAnimation.onfinish = () => {
          bigtext.textContent = footballel.textContent

          bigtext.animate([
            { opacity: 0, transform: 'translateY(10px)' },
            { opacity: 1, transform: 'translateY(0px)' }
          ], {
            duration: 300,
            easing: 'ease-out'
         }); }
      }

    } catch (error) {
      // No need to handle error; Sometimes pretarget will be empty and that's fine.
    } finally {
      pretarget = target
    }
  };

  footballel.style.color = "#fff"

  const range = document.createRange();
  range.selectNodeContents(footballel);
  const football = range.getBoundingClientRect();
  const cursor = document.querySelector('#cursor');
  const container = document.querySelector('.div3').getBoundingClientRect();

  const widthDifference = football.right - document.querySelector('.div3').getBoundingClientRect().right;
  let cursorWidth = football.width

  if (football.right > document.querySelector('.div3').getBoundingClientRect().right ) {
     cursorWidth = football.width - widthDifference
   };

  cursor.style.setProperty('--target-height', `${football.height}px`);
  cursor.style.setProperty('--target-width', `${cursorWidth}px`);
  cursor.style.setProperty('--target-top', `${football.top}px`);
  cursor.style.setProperty('--target-left', `${football.left}px`);

  if (shopDropdownopen) {
    requestAnimationFrame(animate);
  }
}

requestAnimationFrame(animate);






document.querySelector('button').addEventListener('click', () => {

  target = '#basketball'

});


const sports = document.querySelectorAll('.sportslink');

sports.forEach(sport => {
  sport.id = sport.textContent.replaceAll(' ', '').toUpperCase()
  // sport.addEventListener('mouseenter', (event) => {
  //   target = `#${sport.id}`
  // });

  sport.addEventListener('click', (event) => {
    target = `#${sport.id}`
  });
});


</script>
