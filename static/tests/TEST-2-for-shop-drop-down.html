<style>

/* Modern Standard (Firefox and upcoming browsers) */
html {
  /* Format: scrollbar-color: [Grabber Color] [Track Color] */
  scrollbar-color: #888888 transparent;
  scrollbar-width: thin;
}

/* WebKit Browsers (Chrome, Edge, Safari) */
::-webkit-scrollbar {
  width: 8px;  /* Width of vertical scrollbar */
  height: 8px; /* Height of horizontal scrollbar */
}

/* The Track (The white background area) */
::-webkit-scrollbar-track {
  background: transparent; /* Makes the track invisible */
}

/* The Grabber (The draggable handle) */
::-webkit-scrollbar-thumb {
  background: #888888;    /* Color of the grabber */
  border-radius: 4px;     /* Rounds the corners of the grabber */
}

/* Optional: Change grabber color on hover */
::-webkit-scrollbar-thumb:hover {
  background: #555555;
}


.parent {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 20px;
    height: 100%;

}

.div1 {
    grid-column: span 2 / span 2;
    background: #F42300
}

.div2 {

}

.div3 {

    grid-row-start: 2;

}

.div4 {

<script>

let shopDropdownopen = true

function animate(timestamp) {
  const footballel = document.querySelector('#football');

  const range = document.createRange();
  range.selectNodeContents(footballel);
  const football = range.getBoundingClientRect();
  const cursor = document.querySelector('#cursor');
  const container = document.querySelector('.div3').getBoundingClientRect();

  const widthDifference = football.right - document.querySelector('.div3').getBoundingClientRect().right;


  const x = document.querySelector('#x');

  console.log("football.width " + `${football.width}`)
  console.log("football.width - widthDifference " + `${football.width - widthDifference}`)

  x.style.setProperty('--target-height', `${football.height}px`);
  x.style.setProperty('--target-width', `${widthDifference}px`);
  x.style.setProperty('--target-top', `${document.querySelector('.div3').getBoundingClientRect().top}px`);
  x.style.setProperty('--target-left', `${document.querySelector('.div3').getBoundingClientRect().right}px`);

  let cursorWidth = football.width

  if (football.right > document.querySelector('.div3').getBoundingClientRect().right ) {
     cursorWidth = football.width - widthDifference
   };


  cursor.style.setProperty('--target-height', `${football.height}px`);
  cursor.style.setProperty('--target-width', `${cursorWidth}px`);
  cursor.style.setProperty('--target-top', `${football.top}px`);
  cursor.style.setProperty('--target-left', `${football.left}px`);

  console.log("x and cursor diff" + (cursor.getBoundingClientRect().right - x.getBoundingClientRect().right))

  if (shopDropdownopen) {
    requestAnimationFrame(animate);
  }

}

requestAnimationFrame(animate);
