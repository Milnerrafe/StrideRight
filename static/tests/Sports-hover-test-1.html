<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow on Hover</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .glow-card {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #1e1e1e; /* Base dark color */
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 1. Turns to a brighter color on hover */
        .glow-card:hover {
            background-color: #F3A000;
            color: #fff;
        }

        /* 2. The radial gradient that follows the cursor */
        .glow-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Uses CSS variables updated by JavaScript */
            background: radial-gradient(
                80px circle at var(--mouse-x, 0) var(--mouse-y, 0),
                rgba(255, 255, 255, 0.08),
                transparent 100%
            );
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none; /* Prevents the pseudo-element from blocking mouse events */
        }

        /* Only show the radial glow when hovering */
        .glow-card:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="glow-card">Hover Me</div>

    <script>
        const card = document.querySelector('.glow-card');

        card.addEventListener('mousemove', (e) => {
            // Get the boundaries of the card
            const rect = card.getBoundingClientRect();

            // Calculate mouse position relative to the card
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Update the CSS variables
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>

</body>
</html>
